    <!-- LOAD SONG DATA -->
    <script src="songs.js"></script>


    <!-- PAGE LOADING -->
    <script>
      window.addEventListener("load", () => {

        window.setTimeout(() => {

          document.body.classList.remove("is-loading");

        }, 1000);

      });
    </script>


    <!-- SONG DISPLAY -->
    <script>

      const params =
        new URLSearchParams(window.location.search);

      const songSlug =
        params.get("song");

      const song =
        songs.find(
          (item) => item.slug === songSlug
        );


      if (song) {

        document.title =
          `${song.title} • Kevin Isaac`;


        document.getElementById("songCover").src =
          song.cover;

        document.getElementById("songCover").alt =
          `Portada de ${song.title}`;

        const songBackground =
          document.getElementById("songBackground");

        songBackground.style.backgroundImage =
          `url("${song.cover}")`;

        document.body.classList.add("song-loaded");

        document.getElementById("songTitle").textContent =
          song.title;


        document.getElementById("songRelease").textContent =
          song.published || "Fecha de publicación no disponible";


        document.getElementById("songDuration").textContent =
          song.duration;


        document.getElementById("songMusic").textContent =
          song.music;


        document.getElementById("songComposer").textContent =
          song.composer;


        document.getElementById("songCollaborators").textContent =
          song.collaborators;

        
        const platformsContainer =
            document.getElementById("songPlatforms");

            if (song.links) {

            if (song.links.spotify) {

                const spotifyLink =
                document.createElement("a");

                spotifyLink.href =
                song.links.spotify;

                spotifyLink.target =
                "_blank";

                spotifyLink.rel =
                "noreferrer";

                spotifyLink.className =
                "song-platform spotify";

                spotifyLink.textContent =
                "Spotify";

                platformsContainer.appendChild(
                spotifyLink
                );

            }


            if (song.links.youtube) {

                const youtubeLink =
                document.createElement("a");

                youtubeLink.href =
                song.links.youtube;

                youtubeLink.target =
                "_blank";

                youtubeLink.rel =
                "noreferrer";

                youtubeLink.className =
                "song-platform youtube";

                youtubeLink.textContent =
                "YouTube";

                platformsContainer.appendChild(
                youtubeLink
                );

            }

            }


        const lyricsContainer =
          document.getElementById("songLyrics");


        const stanzas = song.lyrics
            .trim()
            .split(/\n\s*\n/);

            stanzas.forEach((stanza) => {
            const stanzaElement = document.createElement("div");
            stanzaElement.className = "lyric-stanza";

            stanza.split("\n").forEach((line) => {
                const lineElement = document.createElement("p");
                lineElement.textContent = line.trim();
                stanzaElement.appendChild(lineElement);
            });

            lyricsContainer.appendChild(stanzaElement);
        });

      } else {

        document.getElementById("songTitle").textContent =
          "Canción no encontrada";

        document.getElementById("songLyrics").innerHTML =
          "<p>La canción que buscas no existe.</p>";

      }

    </script>

    <!-- PARTICLES -->
    <script>

      const canvas =
        document.getElementById("particles");

      const ctx =
        canvas.getContext("2d");


      canvas.width =
        window.innerWidth;

      canvas.height =
        window.innerHeight;


      let particlesArray = [];

      let scrollFactor = 0;


      window.addEventListener("scroll", () => {

        scrollFactor =
          window.scrollY /
          window.innerHeight;

      });


      class Particle {

        constructor() {

          this.x =
            Math.random() *
            canvas.width;

          this.y =
            Math.random() *
            canvas.height;

          this.size =
            Math.random() * 2 +
            0.5;

          this.speedX =
            Math.random() * 0.3 -
            0.15;

          this.speedY =
            Math.random() * 0.3 -
            0.15;

        }


        update() {

          this.x += this.speedX;
          this.y += this.speedY;


          if (this.x < 0)
            this.x = canvas.width;

          if (this.x > canvas.width)
            this.x = 0;


          if (this.y < 0)
            this.y = canvas.height;

          if (this.y > canvas.height)
            this.y = 0;

        }


        draw() {

          let r =
            229 -
            scrollFactor * 100;

          let g =
            138 +
            scrollFactor * 50;

          let b =
            73 +
            scrollFactor * 120;


          ctx.fillStyle =
            `rgba(${r}, ${g}, ${b}, 0.7)`;


          ctx.beginPath();


          ctx.arc(
            this.x,
            this.y,
            this.size,
            0,
            Math.PI * 2
          );


          ctx.fill();

        }

      }


      function init() {

        particlesArray = [];


        for (
          let i = 0;
          i < 90;
          i++
        ) {

          particlesArray.push(
            new Particle()
          );

        }

      }


      function animate() {

        ctx.clearRect(
          0,
          0,
          canvas.width,
          canvas.height
        );


        particlesArray.forEach(
          (particle) => {

            particle.update();
            particle.draw();

          }
        );


        requestAnimationFrame(
          animate
        );

      }


      init();
      animate();


      window.addEventListener(
        "resize",
        () => {

          canvas.width =
            window.innerWidth;

          canvas.height =
            window.innerHeight;

          init();

        }
      );

    </script>

  </body>
